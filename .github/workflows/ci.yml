# Offline by design: no keys, no paid calls. CI runs `make check`, the same target used locally.
# The PostgreSQL tests run against a service container here (locally: the bundled pgserver).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_HOST_AUTH_METHOD: trust  # throwaway CI database on localhost; no credentials
          POSTGRES_USER: taskq
          POSTGRES_DB: taskq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      UV_LOCKED: "1"  # fail if uv.lock is out of date with pyproject.toml
      PGTASKQ_TEST_DATABASE_URL: postgresql://taskq@localhost:5432/taskq
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: make check
        run: make check
