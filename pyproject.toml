[project]
name = "pg-taskq"
version = "0.1.0"
description = "Durable background jobs on plain PostgreSQL: SKIP LOCKED claims, leases with heartbeats, retries with backoff, and a transactional outbox."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Hossam Afifi" }]
# psycopg needs libpq: either the system's, or the bundled one from the `binary` extra.
dependencies = [
    "psycopg>=3.2",
]

[project.optional-dependencies]
binary = ["psycopg[binary]>=3.2"]

[project.urls]
Repository = "https://github.com/AfifiNL/pg-taskq"

[project.scripts]
pg-taskq = "pg_taskq.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "hypothesis>=6.100",
    "psycopg[binary]>=3.2",
]
localpg = [
    "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license metadata
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pg_taskq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pg_taskq"]
mypy_path = "src"
